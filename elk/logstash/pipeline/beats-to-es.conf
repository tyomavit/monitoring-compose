input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_tag => ["via_logstash"]
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    data_stream => "false"
    index => "%{[@metadata][beat]}-%{[@metadata][version]}"
    action => "create"
    manage_template => false
    ilm_enabled => false
  }
}

